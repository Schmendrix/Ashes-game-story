<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vermillion: Ashes Game Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ebe8e2;
      --text: #2c2c2c;
      --muted: #6b7280;
      --charcoal: #364050;
      --accent: #b91c1c;
      --vermilion: #b91c1c;
      --accent-muted: rgba(185, 28, 28, 0.15);
      --gold: #c9a227;
      --gold-muted: rgba(201, 162, 39, 0.2);
      --p1: #0d9488;
      --p1-muted: rgba(13, 148, 136, 0.2);
      --p2: #b45309;
      --p2-muted: rgba(180, 83, 9, 0.2);
      --green: #047857;
      --red: #b91c1c;
      --border: #d1d5db;
      --grid: rgba(55, 65, 81, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      min-height: 100vh;
    }
    h1 {
      font-family: 'Lora', serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: var(--vermilion);
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .phoenixborn-cards {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .phoenixborn-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      min-width: 180px;
    }
    .phoenixborn-card.p1-card { border-left-color: var(--p1); }
    .phoenixborn-card.p2-card { border-left-color: var(--p2); }
    .phoenixborn-card .player { color: var(--muted); font-size: 0.85rem; }
    .phoenixborn-card .name { font-weight: 600; color: var(--charcoal); }
    .phoenixborn-card.p1-card .name { color: var(--p1); }
    .phoenixborn-card.p2-card .name { color: var(--p2); }
    .chart-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .chart-controls .layer-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-right: 0.25rem;
    }
    .chart-controls .layer-cb {
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      user-select: none;
    }
    .chart-controls .layer-cb:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-muted);
    }
    .chart-controls .layer-cb input {
      margin-right: 0.35rem;
      accent-color: var(--accent);
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin-bottom: 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .chart-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .chart-legend .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .chart-legend .swatch-line {
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }
    .chart-legend .swatch-line-dashed {
      width: 20px;
      height: 0;
      border-top: 3px dashed;
      border-radius: 0;
    }
    .chart-legend .legend-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      align-self: center;
    }
    .chart-container {
      background: var(--surface);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      position: relative;
      height: 320px;
    }
    .chart-container canvas { max-height: 300px; }
    .error {
      background: var(--accent-muted);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .hidden { display: none !important; }
    .input-panel { margin-bottom: 1rem; }
    .chat-label { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.25rem; }
    .chat-textarea {
      width: 100%;
      min-height: 140px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
    }
    .chat-textarea::placeholder { color: var(--muted); }
    .parse-btn {
      margin-top: 0.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .parse-btn:hover { filter: brightness(1.1); }
    .dice-na { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .game-result {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--text);
    }
    .narrative-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .narrative-heading {
      font-size: 1.1rem;
      color: var(--text);
      margin: 0 0 0.75rem;
    }
    .narrative-content {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--charcoal);
    }
    .narrative-content .narr-round {
      margin-bottom: 0.75rem;
    }
    .narrative-content .narr-round-header {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    .narrative-content .narr-turn {
      margin-left: 1rem;
      margin-bottom: 0.3rem;
    }
    .narrative-content .narr-state {
      display: inline-block;
      padding: 0.15em 0.5em;
      border-radius: 4px;
      font-size: 0.9em;
      font-weight: 600;
    }
    .narrative-content .narr-pivot-label { color: var(--gold); }
    .narrative-content .narr-swing-note {
      font-size: 0.88rem;
      color: var(--gold);
      font-weight: 600;
      margin-top: 0.2rem;
    }
    .narrative-content .narr-chat-swing {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 0.25rem;
      margin-left: 0.5rem;
    }
    .narrative-content .narr-result {
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.5rem;
    }
    .game-result .winner-name { font-weight: 600; color: var(--gold); }
    .game-result .result-detail { color: var(--muted); }
    .stats-section {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .stats-heading {
      font-size: 1.1rem;
      color: var(--text);
      margin: 0 0 0.75rem;
    }
    .stats-content {
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .stats-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .stats-table td {
      padding: 0.35rem 0.75rem;
      border-bottom: 1px solid rgba(59, 66, 97, 0.3);
    }
    .stats-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .stats-table .stat-label {
      color: var(--muted);
    }
    .stats-table .p1-col { color: var(--p1); }
    .stats-table .p2-col { color: var(--p2); }
    .export-row {
      margin-bottom: 1rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .export-btn {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0.45rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .export-btn:hover {
      background: var(--accent-muted);
    }
  </style>
</head>
<body>
  <h1>Vermillion: Ashes Game Report</h1>
  <p class="subtitle">Paste a game chat log to visualize health, dice advantage, and attacks turn by turn. Phoenixborn starting life uses the standard card values (health = middle stat).</p>

  <div id="panel-chat" class="input-panel">
    <label for="chatInput" class="chat-label">Paste your game chat here (Ctrl+V or Cmd+V):</label>
    <textarea id="chatInput" class="chat-textarea" placeholder="Paste the full game chat from Ashteki here (e.g. Schmendrix brings Lulu Firststone to battle&#10;shadowfire brings Fiona Mercywind to battle&#10;Round 1&#10;...)"></textarea>
    <button type="button" id="parseChatBtn" class="parse-btn">Parse and visualize</button>
  </div>

  <div id="errorBox" class="error hidden"></div>
  <div id="phoenixbornSection" class="phoenixborn-cards hidden"></div>
  <div id="gameResultBox" class="game-result hidden"></div>
  <div id="exportRow" class="export-row hidden">
    <button type="button" id="exportBtn" class="export-btn">Export Report</button>
    <button type="button" id="copyDiscordBtn" class="export-btn">Copy for Discord</button>
  </div>

  <div id="chartSection" class="hidden">
    <div class="chart-controls">
      <span class="layer-label">Layers:</span>
      <label class="layer-cb"><input type="checkbox" id="layerHealth" checked> Health</label>
      <label class="layer-cb"><input type="checkbox" id="layerTotalAdv"> Total resource advantage</label>
      <label class="layer-cb"><input type="checkbox" id="layerDice"> Dice advantage</label>
      <label class="layer-cb"><input type="checkbox" id="layerBattlefield"> Battlefield value</label>
      <label class="layer-cb"><input type="checkbox" id="layerAttacks"> Attacks</label>
      <span id="diceNaNote" class="dice-na hidden"></span>
    </div>
    <div id="chartLegend" class="chart-legend"></div>
    <div class="chart-container">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <div id="statsSection" class="stats-section hidden">
    <h2 class="stats-heading">Game Summary</h2>
    <div id="statsContent" class="stats-content"></div>
  </div>

  <div id="narrativeSection" class="narrative-section hidden" role="region" aria-label="Game narrative">
    <h2 class="narrative-heading">Game Narrative</h2>
    <div id="narrativeContent" class="narrative-content"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var errorBox = document.getElementById('errorBox');
      var phoenixbornSection = document.getElementById('phoenixbornSection');
      var chartSection = document.getElementById('chartSection');
      var layerHealth = document.getElementById('layerHealth');
      var layerTotalAdv = document.getElementById('layerTotalAdv');
      var layerDice = document.getElementById('layerDice');
      var layerBattlefield = document.getElementById('layerBattlefield');
      var layerAttacks = document.getElementById('layerAttacks');
      var canvas = document.getElementById('mainChart');
      var diceNaNote = document.getElementById('diceNaNote');

      var chart = null;
      var replayData = null;

      // Theme colors for charts (naturalistic: teal P1, amber P2; red accent)
      var CHART_P1 = '#0d9488';
      var CHART_P1_FILL = 'rgba(13, 148, 136, 0.2)';
      var CHART_P2 = '#b45309';
      var CHART_P2_FILL = 'rgba(180, 83, 9, 0.2)';
      var CHART_GRID = 'rgba(55, 65, 81, 0.25)';
      var CHART_TICKS = '#6b7280';
      var CHART_P1_ADV = 'rgba(13, 148, 136, 0.85)';
      var CHART_P2_ADV = 'rgba(180, 83, 9, 0.85)';

      // Unit name -> dice cost override (for units that enter under special conditions)
      var UNIT_DICE_COST = {
        'Raptor Herder': 0.5, 'Raptor hatchling': 0.5, 'Raptor Hatchling': 0.5,
        'Pterra Herder': 0.5, 'Pterra hatchling': 0.5, 'Pterra Hatchling': 0.5,
        'Hand of Spear': 1, 'Hand of Shield': 1,
        'Luminous Seedling': 2, 'Brilliant Thorns': 2,
        'Blood puppet': -1, 'Blood Puppet': -1,
        'Weeping Spirit': -1,
        'Rubble Spirit': 1,
        'Pack Wolf': 0.5, 'Pack wolf': 0.5
      };

      // Phoenixborn name -> starting life (middle stat: attack / life / spellboard)
      var PHOENIXBORN_LIFE = {
        'Aradel Summergaard': 16, 'Arren Frostpeak': 15, 'Astrea': 19, 'Brennen Blackcloud': 16,
        'Coal Roarkwin': 15, 'Dimona Odinstar': 16, 'Echo Greystorm': 19, 'Fiona Mercywind': 15,
        'Harold Westraven': 16, 'Hope Everthorn': 17, 'Issa Brightmore': 18, 'James Endersight': 19,
        'Jericho, Reborn': 17, 'Jessa Na Ni': 19, 'Koji Wolfcub': 16, 'Leo Sunshadow': 19,
        'Lulu Firststone': 16, 'Maeoni Viper': 20, 'Namine Hymntide': 17, 'Noah Redmoon': 16,
        'Odette Diamondcrest': 18, 'Orrick Gilstream': 19, 'Rimea Careworn': 17, 'Rin Northfell': 17,
        'Rowan Umberend': 18, 'Saria Guideman': 20, 'Sembali Grimtongue': 19, 'Tristan Darkwater': 17,
        'Victoria Glassfire': 18, 'Xander Heartsblood': 20
      };

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      }
      function clearError() {
        errorBox.classList.add('hidden');
      }

      function getPhoenixbornLife(pbName) {
        if (PHOENIXBORN_LIFE[pbName] != null) return PHOENIXBORN_LIFE[pbName];
        return 20;
      }

      function parseChatLog(text) {
        if (!text || typeof text !== 'string') return null;
        var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);

        // Pass 1: extract players and Phoenixborn
        var playerToPb = {};
        var pbToPlayer = {};
        var playerNames = [];
        for (var i = 0; i < lines.length; i++) {
          var m = lines[i].match(/^(\S+)\s+brings\s+(.+?)\s+to battle\s*$/);
          if (m) {
            var player = m[1];
            var pb = m[2].trim();
            playerToPb[player] = pb;
            pbToPlayer[pb] = player;
            if (playerNames.indexOf(player) === -1) playerNames.push(player);
          }
        }
        if (playerNames.length < 2) return null;

        var p1 = playerNames[0];
        var p2 = playerNames[1];
        var life1 = getPhoenixbornLife(playerToPb[p1]);
        var life2 = getPhoenixbornLife(playerToPb[p2]);
        var health = {};
        health[p1] = life1;
        health[p2] = life2;
        var diceSpent = {};
        diceSpent[p1] = 0;
        diceSpent[p2] = 0;

        var currentRound = 0;
        var currentTurnNum = 0;
        var currentTurnPlayer = null;
        var pairTurnNum = 0;
        var pairPlayersGone = 0;
        var pairAttacks = []; // array of { player, count, units } for each attack in this pair
        var pairChatLines = [];
        var snapshots = [];
        var gameResult = null;

        // Battlefield tracking: { playername: { unitId: { name, cost } } }
        var battlefield = {};
        battlefield[p1] = {};
        battlefield[p2] = {};
        var pendingDiceCost = 0;
        var pendingDicePlayer = null;
        var lastInlineDieKey = null; // heuristic: same player + same die type on consecutive lines = 1 die

        // Summary stat counters
        var stats = {};
        stats[p1] = { cardsPlayed: 0, meditated: 0, totalDiceSpent: 0, totalAttacks: 0, totalUnitsAttacking: 0, totalDamageDealt: 0 };
        stats[p2] = { cardsPlayed: 0, meditated: 0, totalDiceSpent: 0, totalAttacks: 0, totalUnitsAttacking: 0, totalDamageDealt: 0 };

        function makeState(attackPlayer, attackCount) {
          var state = { round: currentRound, players: {} };
          [p1, p2].forEach(function (p, idx) {
            var h = health[p];
            var life = p === p1 ? life1 : life2;
            var spent = diceSpent[p] || 0;
            var unspent = Math.max(0, 10 - spent);
            var dice = [];
            for (var d = 0; d < unspent; d++) dice.push({ exhausted: false });
            for (var d = 0; d < spent; d++) dice.push({ exhausted: true });
            // Battlefield value
            var bf = battlefield[p];
            var bfUnits = Object.keys(bf).length;
            var bfValue = 0;
            for (var bk in bf) { bfValue += bf[bk].cost; }
            state.players[p] = {
              id: idx,
              name: p,
              phoenixborn: { name: playerToPb[p], life: life, damage: Math.max(0, life - h), drowningLevel: 0 },
              dice: dice,
              battlefieldUnits: bfUnits,
              battlefieldValue: bfValue
            };
          });
          if (attackPlayer != null && attackCount > 0) {
            var id = attackPlayer === p1 ? 0 : 1;
            state.attack = { attackingPlayer: id, battles: new Array(attackCount) };
          }
          return state;
        }

        function flushPair() {
          if (pairTurnNum === 0) return;
          // Combine attacks from both turns in the pair
          var totalAttackCount = 0;
          var attackPlayer = null;
          var attackUnitsList = [];
          for (var ai = 0; ai < pairAttacks.length; ai++) {
            totalAttackCount += pairAttacks[ai].count;
            attackPlayer = pairAttacks[ai].player; // last attacker shown
            if (pairAttacks[ai].units) attackUnitsList.push(pairAttacks[ai].units);
          }
          snapshots.push({
            state: makeState(attackPlayer, totalAttackCount),
            turnLabel: 'R' + currentRound + '.' + pairTurnNum,
            tag: 'turn',
            attackUnits: attackUnitsList.join(', '),
            pairAttacks: pairAttacks.slice(),
            chatLines: pairChatLines.slice()
          });
          pairAttacks = [];
          pairChatLines = [];
        }

        // Pass 2: parse events turn by turn
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var roundMatch = line.match(/^Round\s+(\d+)\s*$/);
          var turnMatch = line.match(/^Turn\s+(\d+)\s+-\s+(\S+)\s*$/);
          if (!roundMatch && !turnMatch) pairChatLines.push(line);

          // Round start
          if (roundMatch) {
            flushPair();
            lastInlineDieKey = null;
            // Accumulate dice spent this round into totals before resetting
            if (stats[p1]) stats[p1].totalDiceSpent += diceSpent[p1] || 0;
            if (stats[p2]) stats[p2].totalDiceSpent += diceSpent[p2] || 0;
            currentRound = parseInt(roundMatch[1], 10);
            currentTurnPlayer = null;
            currentTurnNum = 0;
            pairTurnNum = 0;
            pairPlayersGone = 0;
            diceSpent[p1] = 0;
            diceSpent[p2] = 0;
            snapshots.push({
              state: makeState(null, 0),
              turnLabel: 'R' + currentRound + ' start',
              tag: 'round'
            });
            continue;
          }

          // Turn start
          if (turnMatch) {
            var newTurnNum = parseInt(turnMatch[1], 10);
            if (newTurnNum !== pairTurnNum) {
              // New pair — flush previous pair
              flushPair();
              lastInlineDieKey = null;
              pairTurnNum = newTurnNum;
              pairPlayersGone = 1;
            } else {
              // Second player in the pair
              pairPlayersGone = 2;
              lastInlineDieKey = null;
            }
            currentTurnNum = newTurnNum;
            currentTurnPlayer = turnMatch[2];
            continue;
          }

          // Attack (accumulated into pair)
          var attackMatch = line.match(/^(\S+)\s+attacks\s+.+with\s+(\d+)\s+units?:\s*(.+)$/);
          if (attackMatch) {
            var attacker = attackMatch[1];
            var count = parseInt(attackMatch[2], 10);
            if (playerNames.indexOf(attacker) !== -1) {
              pairAttacks.push({
                player: attacker,
                count: count,
                units: attackMatch[3].replace(/\s*\(\d+\)/g, '').trim()
              });
              if (stats[attacker]) {
                stats[attacker].totalAttacks++;
                stats[attacker].totalUnitsAttacking += count;
              }
            }
            continue;
          }

          // Phoenixborn damage (accumulated into current turn)
          // Pattern A: "PBName receives/takes N damage"
          for (var j = 0; j < Object.keys(pbToPlayer).length; j++) {
            var pbName = Object.keys(pbToPlayer)[j];
            var escaped = pbName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var damageMatch = line.match(new RegExp('^' + escaped + '\\s+(?:receives|takes)\\s+(\\d+)\\s+damage', 'i'));
            if (damageMatch) {
              var amount = parseInt(damageMatch[1], 10);
              var damagedPlayer = pbToPlayer[pbName];
              health[damagedPlayer] = Math.max(0, health[damagedPlayer] - amount);
              // Track damage dealt to this player (by the opponent)
              var attacker = damagedPlayer === p1 ? p2 : p1;
              if (stats[attacker]) stats[attacker].totalDamageDealt += amount;
              break;
            }
          }
          // Pattern B: "Player adds a damage to PBName" (manual mode)
          for (var j2 = 0; j2 < Object.keys(pbToPlayer).length; j2++) {
            var pbName2 = Object.keys(pbToPlayer)[j2];
            var escaped2 = pbName2.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var manualDmgMatch = line.match(new RegExp('adds\\s+(?:a|\\d+)\\s+damage\\s+to\\s+' + escaped2, 'i'));
            if (manualDmgMatch) {
              var manualAmt = 1;
              var numMatch = line.match(/adds\s+(\d+)\s+damage/);
              if (numMatch) manualAmt = parseInt(numMatch[1], 10);
              var damagedPlayer2 = pbToPlayer[pbName2];
              health[damagedPlayer2] = Math.max(0, health[damagedPlayer2] - manualAmt);
              var attacker2 = damagedPlayer2 === p1 ? p2 : p1;
              if (stats[attacker2]) stats[attacker2].totalDamageDealt += manualAmt;
              break;
            }
          }
          // Pattern C: "PBName is destroyed" — ensure health is 0 (catches any missed damage)
          for (var j3 = 0; j3 < Object.keys(pbToPlayer).length; j3++) {
            var pbName3 = Object.keys(pbToPlayer)[j3];
            var escaped3 = pbName3.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (line.match(new RegExp('^' + escaped3 + '\\s+is destroyed', 'i'))) {
              var destroyedPlayer = pbToPlayer[pbName3];
              if (health[destroyedPlayer] > 0) {
                var remaining = health[destroyedPlayer];
                health[destroyedPlayer] = 0;
                // Attribute untracked damage to opponent
                var opp = destroyedPlayer === p1 ? p2 : p1;
                if (stats[opp]) stats[opp].totalDamageDealt += remaining;
              }
              break;
            }
          }

          // Game end
          var concedeMatch = line.match(/^(\S+)\s+concedes\s*$/);
          if (concedeMatch) {
            gameResult = { method: 'concession', conceder: concedeMatch[1], round: currentRound, turn: currentTurnNum };
            continue;
          }
          var winMatch = line.match(/^(\S+)\s+has won the game\s*$/);
          if (winMatch) {
            gameResult = gameResult || { method: 'defeat', round: currentRound, turn: currentTurnNum };
            gameResult.winner = winMatch[1];
            gameResult.winnerPb = playerToPb[winMatch[1]] || winMatch[1];
            flushPair();
            // Accumulate final round's dice into totals
            if (stats[p1]) stats[p1].totalDiceSpent += diceSpent[p1] || 0;
            if (stats[p2]) stats[p2].totalDiceSpent += diceSpent[p2] || 0;
            currentTurnPlayer = null;
            pairTurnNum = 0;
            snapshots.push({
              state: makeState(null, 0),
              turnLabel: 'End',
              tag: 'end'
            });
            break;
          }

          // Dice spending: Pattern A - dice cost prefix
          var diceCostMatch = line.match(/^(.+?)\s*:\s*(\S+)\s+(?:plays|uses)\s/);
          if (diceCostMatch && /die/.test(diceCostMatch[1])) {
            var spender = diceCostMatch[2];
            var diceCount = diceCostMatch[1].split(',').length;
            if (diceSpent[spender] != null) {
              diceSpent[spender] += diceCount;
            }
            // Track pending cost for battlefield
            pendingDiceCost = diceCount;
            pendingDicePlayer = spender;
          }

          // Dice spending: Pattern B - inline die use
          var inlineDieMatch = line.match(/^(\S+)\s+uses\s+(\w+)\s+(basic|class|power)\s+die\s+to\s/);
          if (inlineDieMatch) {
            var spender2 = inlineDieMatch[1];
            var dieType = inlineDieMatch[2] + ' ' + inlineDieMatch[3]; // e.g. "time power"
            var inlineKey = spender2 + ':' + dieType;
            if (inlineKey === lastInlineDieKey) {
              // Same die used for multiple actions (e.g. place + remove status token) — count once
              lastInlineDieKey = inlineKey; // keep so we skip any further duplicates
            } else {
              // Different die or first use — count it
              if (diceSpent[spender2] != null) diceSpent[spender2] += 1;
              lastInlineDieKey = inlineKey;
            }
          }

          // Stats: cards played (with or without dice cost prefix)
          var playsMatch = line.match(/(?::\s*)?(\S+)\s+plays\s+/);
          if (playsMatch && stats[playsMatch[1]]) {
            stats[playsMatch[1]].cardsPlayed++;
          }

          // Stats: meditation
          var meditateMatch = line.match(/^(\S+)\s+meditates\s+/);
          if (meditateMatch && stats[meditateMatch[1]]) {
            stats[meditateMatch[1]].meditated++;
          }

          // Battlefield: unit enters play
          var entersMatch = line.match(/^(\S+)\s+puts\s+(.+?)\s+\((\d+)\)\s+into play/);
          if (entersMatch) {
            var owner = entersMatch[1];
            var unitName = entersMatch[2];
            var unitId = entersMatch[3];
            if (battlefield[owner]) {
              var cost = UNIT_DICE_COST[unitName] != null ? UNIT_DICE_COST[unitName]
                : (owner === pendingDicePlayer && pendingDiceCost > 0 ? pendingDiceCost : 0);
              battlefield[owner][unitId] = { name: unitName, cost: cost };
              pendingDiceCost = 0;
              pendingDicePlayer = null;
            }
          }

          // Battlefield: unit destroyed or removed
          var destroyedMatch = line.match(/^(.+?)\s+\((\d+)\)\s+(?:is destroyed|is removed from play|leaves play)/) ||
            line.match(/remove\s+(.+?)\s+\((\d+)\)\s+from the game/);
          if (destroyedMatch) {
            var deadId = destroyedMatch[2];
            // Find which player owns this unit
            if (battlefield[p1][deadId]) {
              delete battlefield[p1][deadId];
            } else if (battlefield[p2][deadId]) {
              delete battlefield[p2][deadId];
            }
          }

          // Battlefield: manual move from play area to discard/hand/deck (unit leaves)
          var manualOutMatch = line.match(/manually moves\s+(.+?)\s+\((\d+)\)\s+from their play area/);
          if (manualOutMatch) {
            var manualId = manualOutMatch[2];
            if (battlefield[p1][manualId]) {
              delete battlefield[p1][manualId];
            } else if (battlefield[p2][manualId]) {
              delete battlefield[p2][manualId];
            }
          }

          // Battlefield: manual move into play area (unit enters)
          var manualInMatch = line.match(/^(\S+)\s+manually moves\s+(.+?)\s+from their (?:archives|discard|hand)\s+to their play area/);
          if (manualInMatch) {
            var manualOwner = manualInMatch[1];
            var manualName = manualInMatch[2];
            // Try to find the unit ID from subsequent lines (attaches or adds damage)
            if (battlefield[manualOwner]) {
              var foundId = null;
              for (var la = i + 1; la < Math.min(i + 5, lines.length); la++) {
                var idMatch = lines[la].match(new RegExp(manualName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s+\\((\\d+)\\)'));
                if (idMatch) { foundId = idMatch[1]; break; }
              }
              if (foundId) {
                var manualCost = UNIT_DICE_COST[manualName] != null ? UNIT_DICE_COST[manualName] : 0;
                battlefield[manualOwner][foundId] = { name: manualName, cost: manualCost };
              }
            }
          }
        }

        // Flush any remaining open pair (if game ended without explicit end line)
        flushPair();

        if (snapshots.length === 0) return null;
        var phoenixborn = {};
        phoenixborn[p1] = playerToPb[p1] || p1;
        phoenixborn[p2] = playerToPb[p2] || p2;
        return {
          snapshots: snapshots,
          playerNames: playerNames,
          phoenixborn: phoenixborn,
          gameResult: gameResult,
          stats: stats
        };
      }

      function buildSeries() {
        if (!replayData) return null;
        var snapshots = replayData.snapshots;
        var p1 = replayData.playerNames[0];
        var p2 = replayData.playerNames[1];
        var labels = [];
        var diceAdv = [];
        var health1 = [];
        var health2 = [];
        var attackCount = [];
        var attackPlayer = [];
        var attackUnits = [];
        var bfValue1 = [];
        var bfValue2 = [];
        var bfValueAdv = [];
        var chatLines = [];
        var pb1 = replayData.phoenixborn[p1];
        var pb2 = replayData.phoenixborn[p2];

        for (var i = 0; i < snapshots.length; i++) {
          var s = snapshots[i];
          if (s.tag === 'end') continue; // skip End snapshot from charts
          var state = s.state;
          labels.push(s.turnLabel);

          var pl1 = state.players && state.players[p1];
          var pl2 = state.players && state.players[p2];

          // Dice advantage
          var u1 = pl1 && Array.isArray(pl1.dice) ? pl1.dice.filter(function (d) { return !d.exhausted; }).length : 0;
          var u2 = pl2 && Array.isArray(pl2.dice) ? pl2.dice.filter(function (d) { return !d.exhausted; }).length : 0;
          diceAdv.push(u1 - u2);

          // Battlefield value
          var bv1 = pl1 ? (pl1.battlefieldValue || 0) : 0;
          var bv2 = pl2 ? (pl2.battlefieldValue || 0) : 0;
          bfValue1.push(bv1);
          bfValue2.push(bv2);
          bfValueAdv.push(bv1 - bv2);

          // Health
          var h1 = pl1 && pl1.phoenixborn ? Math.max(0, pl1.phoenixborn.life - (pl1.phoenixborn.damage || 0) - (pl1.phoenixborn.drowningLevel || 0)) : 0;
          var h2 = pl2 && pl2.phoenixborn ? Math.max(0, pl2.phoenixborn.life - (pl2.phoenixborn.damage || 0) - (pl2.phoenixborn.drowningLevel || 0)) : 0;
          health1.push(h1);
          health2.push(h2);

          // Attacks (from pairAttacks stored on snapshot)
          var pa = s.pairAttacks || [];
          if (pa.length > 0) {
            var totalCount = 0;
            var allUnits = [];
            var lastAttacker = null;
            for (var ai = 0; ai < pa.length; ai++) {
              totalCount += pa[ai].count;
              if (pa[ai].units) allUnits.push(pa[ai].units);
              lastAttacker = pa[ai].player;
            }
            attackCount.push(totalCount);
            attackPlayer.push(lastAttacker ? (replayData.phoenixborn[lastAttacker] || lastAttacker) : null);
            attackUnits.push(allUnits.join(', '));
          } else {
            attackCount.push(0);
            attackPlayer.push(null);
            attackUnits.push('');
          }
          chatLines.push(s.chatLines || []);
        }

        // Compute single game situation per turn pair (no damage; health advantage for compensation/parity)
        // Net health: P1 − P2; advantaged player "6+ life behind" means add " With Compensation"
        var stateColors = {
          'dominant-position': '#c9a227',
          'committed-advantage': '#059669',
          'unrealized-advantage': '#0284c7',
          'comfortable-parity': '#6b7280',
          'parity': '#6b7280',
          'split': '#7c3aed'
        };
        var stateLabels = {
          'dominant-position': 'Dominant Position',
          'committed-advantage': 'Committed Advantage',
          'unrealized-advantage': 'Unrealized Advantage',
          'comfortable-parity': 'Comfortable Parity',
          'parity': 'Parity',
          'split': 'Split (Proactive / Reactive)'
        };

        // situation[]: { key, player (pb name or null), desc (full text) }
        var situation = [];
        for (var si = 0; si < labels.length; si++) {
          var da = diceAdv[si];
          var ba = bfValueAdv[si];
          var healthAdv = (health1[si] || 0) - (health2[si] || 0); // P1 − P2
          var diceParity = da === 0;
          var bfParity = ba === 0;

          function withCompensation(desc, advantagedIsP1) {
            if (advantagedIsP1 && healthAdv <= -6) return desc + ' With Compensation';
            if (!advantagedIsP1 && healthAdv >= 6) return desc + ' With Compensation';
            return desc;
          }

          if (diceParity && bfParity) {
            if (healthAdv > 0) situation.push({ key: 'comfortable-parity', player: pb1, desc: pb1 + ': Comfortable Parity' });
            else if (healthAdv < 0) situation.push({ key: 'comfortable-parity', player: pb2, desc: pb2 + ': Comfortable Parity' });
            else situation.push({ key: 'parity', player: null, desc: 'Parity' });
          } else if (diceParity && !bfParity) {
            var bfLeader = ba > 0 ? pb1 : pb2;
            var bfLeaderIsP1 = ba > 0;
            situation.push({ key: 'committed-advantage', player: bfLeader, desc: withCompensation(bfLeader + ': Committed Advantage', bfLeaderIsP1) });
          } else if (!diceParity && bfParity) {
            var diceLeader = da > 0 ? pb1 : pb2;
            var diceLeaderIsP1 = da > 0;
            situation.push({ key: 'unrealized-advantage', player: diceLeader, desc: withCompensation(diceLeader + ': Unrealized Advantage', diceLeaderIsP1) });
          } else {
            var diceLeaderIsP1 = da > 0;
            var bfLeaderIsP1 = ba > 0;
            if (diceLeaderIsP1 === bfLeaderIsP1) {
              var leader = diceLeaderIsP1 ? pb1 : pb2;
              var leaderIsP1 = diceLeaderIsP1;
              situation.push({ key: 'dominant-position', player: leader, desc: withCompensation(leader + ': Dominant Position', leaderIsP1) });
            } else {
              var dLeader = diceLeaderIsP1 ? pb1 : pb2;
              var bLeader = bfLeaderIsP1 ? pb1 : pb2;
              situation.push({ key: 'split', player: null, desc: 'Split, ' + dLeader + ' Proactive, ' + bLeader + ' Reactive' });
            }
          }
        }

        // Total resource advantage = unspent dice advantage + battlefield value advantage (Chess.com-style)
        var totalAdvantage = [];
        for (var ti = 0; ti < labels.length; ti++) {
          totalAdvantage.push(diceAdv[ti] + bfValueAdv[ti]);
        }

        return {
          labels: labels,
          diceAdvantage: diceAdv,
          health1: health1,
          health2: health2,
          attackCount: attackCount,
          attackPlayer: attackPlayer,
          attackUnits: attackUnits,
          bfValue1: bfValue1,
          bfValue2: bfValue2,
          bfValueAdv: bfValueAdv,
          totalAdvantage: totalAdvantage,
          chatLines: chatLines,
          situation: situation,
          stateColors: stateColors,
          stateLabels: stateLabels
        };
      }

      function renderPhoenixborn() {
        phoenixbornSection.innerHTML = '';
        if (!replayData) return;
        var names = replayData.playerNames;
        var pbs = replayData.phoenixborn;
        for (var i = 0; i < names.length; i++) {
          var card = document.createElement('div');
          card.className = 'phoenixborn-card' + (i === 0 ? ' p1-card' : ' p2-card');
          card.innerHTML = '<div class="player">' + escapeHtml(names[i]) + '</div><div class="name">' + escapeHtml(pbs[names[i]] || names[i]) + '</div>';
          phoenixbornSection.appendChild(card);
        }
        phoenixbornSection.classList.remove('hidden');
      }

      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function updateChart() {
        var series = buildSeries();
        if (!series) return;

        var showHealth = layerHealth.checked;
        var showTotalAdv = layerTotalAdv.checked;
        var showDice = layerDice.checked;
        var showBf = layerBattlefield.checked;
        var showAttacks = layerAttacks.checked;

        if (showDice || showBf || showTotalAdv) {
          diceNaNote.textContent = 'Dice spending estimated from chat log (10 dice per player per round).';
          diceNaNote.classList.remove('hidden');
        } else {
          diceNaNote.classList.add('hidden');
        }

        var p1 = replayData.playerNames[0];
        var p2 = replayData.playerNames[1];
        var pb1 = replayData.phoenixborn[p1];
        var pb2 = replayData.phoenixborn[p2];

        if (chart) chart.destroy();

        var xGrid = { color: CHART_GRID };
        var xTicks = { color: CHART_TICKS, maxRotation: 45 };
        var yGrid = { color: CHART_GRID };
        var yTicks = { color: CHART_TICKS };

        // Build datasets and scales dynamically based on checkboxes
        var datasets = [];
        var scales = { x: { grid: xGrid, ticks: xTicks } };
        var needsLeftAxis = showHealth || showBf || showAttacks;
        var needsRightAxis = showDice || showBf || showTotalAdv;

        // Right axis: symmetric around 0 when total/dice/bf advantage shown
        var rightMax = 5;
        if (showDice) rightMax = Math.max(rightMax, 10);
        if (showBf) {
          for (var rbi = 0; rbi < series.bfValueAdv.length; rbi++) {
            rightMax = Math.max(rightMax, Math.abs(series.bfValueAdv[rbi]));
          }
        }
        if (showTotalAdv && series.totalAdvantage) {
          for (var tai = 0; tai < series.totalAdvantage.length; tai++) {
            rightMax = Math.max(rightMax, Math.abs(series.totalAdvantage[tai]));
          }
        }

        // Determine left axis label
        var leftLabels = [];
        if (showHealth) leftLabels.push('Health');
        if (showBf) leftLabels.push('Battlefield value');
        if (showAttacks) leftLabels.push('Attack units');

        // Determine right axis label
        var rightLabels = [];
        if (showTotalAdv) rightLabels.push('Total resource advantage');
        if (showDice) rightLabels.push('Dice advantage');
        if (showBf) rightLabels.push('Battlefield advantage');

        if (needsLeftAxis) {
          scales.yLeft = {
            type: 'linear', position: 'left', grid: yGrid, ticks: yTicks, min: 0,
            title: { display: true, text: leftLabels.join(' / '), color: CHART_TICKS }
          };
        }
        if (needsRightAxis) {
          scales.yRight = {
            type: 'linear', position: 'right', grid: { drawOnChartArea: false }, ticks: yTicks,
            min: -rightMax, max: rightMax,
            title: { display: true, text: rightLabels.join(' / '), color: CHART_TICKS }
          };
        }

        // Health layers (lines)
        if (showHealth) {
          datasets.push({
            label: pb1 + ' health', type: 'line', data: series.health1,
            borderColor: CHART_P1, backgroundColor: CHART_P1_FILL,
            fill: false, tension: 0.2, pointRadius: 3, yAxisID: 'yLeft', order: 1
          });
          datasets.push({
            label: pb2 + ' health', type: 'line', data: series.health2,
            borderColor: CHART_P2, backgroundColor: CHART_P2_FILL,
            fill: false, tension: 0.2, pointRadius: 3, yAxisID: 'yLeft', order: 1
          });
        }

        // Battlefield value layers (lines, dashed)
        if (showBf) {
          datasets.push({
            label: pb1 + ' battlefield', type: 'line', data: series.bfValue1,
            borderColor: CHART_P1, backgroundColor: CHART_P1_FILL,
            borderDash: [6, 3], fill: false, tension: 0.2, pointRadius: 2, yAxisID: 'yLeft', order: 1
          });
          datasets.push({
            label: pb2 + ' battlefield', type: 'line', data: series.bfValue2,
            borderColor: CHART_P2, backgroundColor: CHART_P2_FILL,
            borderDash: [6, 3], fill: false, tension: 0.2, pointRadius: 2, yAxisID: 'yLeft', order: 1
          });
          datasets.push({
            label: 'BF advantage (' + pb1 + ' − ' + pb2 + ')',
            data: series.bfValueAdv,
            backgroundColor: function (ctx) {
              var v = ctx.raw;
              return v > 0 ? 'rgba(13, 148, 136, 0.35)' : v < 0 ? 'rgba(180, 83, 9, 0.35)' : 'rgba(107, 114, 128, 0.2)';
            },
            borderColor: function (ctx) {
              var v = ctx.raw;
              return v > 0 ? 'rgba(13, 148, 136, 0.6)' : v < 0 ? 'rgba(180, 83, 9, 0.6)' : 'rgba(107, 114, 128, 0.4)';
            },
            borderWidth: 1, yAxisID: 'yRight', order: 3
          });
        }

        // Total resource advantage layer (floating bars: P2 [adv,0], P1 [0,adv] on right axis)
        if (showTotalAdv && series.totalAdvantage) {
          var totalAdv = series.totalAdvantage;
          var p2Bars = totalAdv.map(function (v) { return v < 0 ? [v, 0] : [0, 0]; });
          var p1Bars = totalAdv.map(function (v) { return v > 0 ? [0, v] : [0, 0]; });
          datasets.push({
            label: 'Total resource (' + pb2 + ')',
            data: p2Bars,
            backgroundColor: CHART_P2_ADV,
            borderColor: CHART_P2,
            borderWidth: 1,
            yAxisID: 'yRight',
            order: 4
          });
          datasets.push({
            label: 'Total resource (' + pb1 + ')',
            data: p1Bars,
            backgroundColor: CHART_P1_ADV,
            borderColor: CHART_P1,
            borderWidth: 1,
            yAxisID: 'yRight',
            order: 3
          });
        }

        // Dice advantage layer (bars)
        if (showDice) {
          datasets.push({
            label: 'Dice advantage (' + pb1 + ' − ' + pb2 + ')',
            data: series.diceAdvantage,
            backgroundColor: function (ctx) {
              var v = ctx.raw;
              return v > 0 ? 'rgba(13, 148, 136, 0.35)' : v < 0 ? 'rgba(180, 83, 9, 0.35)' : 'rgba(107, 114, 128, 0.2)';
            },
            borderColor: function (ctx) {
              var v = ctx.raw;
              return v > 0 ? 'rgba(13, 148, 136, 0.6)' : v < 0 ? 'rgba(180, 83, 9, 0.6)' : 'rgba(107, 114, 128, 0.4)';
            },
            borderWidth: 1, yAxisID: 'yRight', order: 2
          });
        }

        // Attack layer (narrow bars)
        if (showAttacks) {
          datasets.push({
            label: 'Attack (units)', type: 'bar',
            data: series.attackCount.map(function (c) { return c > 0 ? c : null; }),
            backgroundColor: function (ctx) {
              var who = series.attackPlayer[ctx.dataIndex];
              if (!who) return 'transparent';
              return who === pb1 ? CHART_P1_ADV : CHART_P2_ADV;
            },
            borderColor: function (ctx) {
              var who = series.attackPlayer[ctx.dataIndex];
              if (!who) return 'transparent';
              return who === pb1 ? CHART_P1 : CHART_P2;
            },
            borderWidth: 2, yAxisID: 'yLeft', order: 0, barPercentage: 0.3
          });
        }

        // If nothing checked, clear and return
        if (datasets.length === 0) {
          if (chart) chart = null;
          document.getElementById('chartLegend').innerHTML = '';
          return;
        }

        // Build tooltip callbacks
        var tooltipAfterLabel = function (ctx) {
          var ds = ctx.dataset;
          if (ds.label && ds.label.indexOf('Total resource') === 0) {
            var v = series.totalAdvantage && series.totalAdvantage[ctx.dataIndex];
            if (v === undefined) return '';
            if (v > 0) return pb1 + ' ahead by ' + v + ' (dice + battlefield)';
            if (v < 0) return pb2 + ' ahead by ' + (-v) + ' (dice + battlefield)';
            return 'Even';
          }
          if (ds.label && ds.label.indexOf('Dice advantage') === 0) {
            var v = ctx.raw;
            if (v > 0) return pb1 + ' has ' + v + ' more unspent dice';
            if (v < 0) return pb2 + ' has ' + (-v) + ' more unspent dice';
            return 'Tied';
          }
          if (ds.label && ds.label.indexOf('BF advantage') === 0) {
            var v = ctx.raw;
            if (v > 0) return pb1 + ' has ' + v + ' more dice of units';
            if (v < 0) return pb2 + ' has ' + (-v) + ' more dice of units';
            return 'Tied on battlefield';
          }
          if (ds.label === 'Attack (units)') {
            var who = series.attackPlayer[ctx.dataIndex];
            if (who && ctx.raw > 0) {
              var units = series.attackUnits[ctx.dataIndex];
              return who + ' attacked with ' + ctx.raw + ' unit(s)' + (units ? ': ' + units : '');
            }
          }
          if (ds.label && ds.label.indexOf('battlefield') !== -1) {
            return ctx.raw + ' dice of units';
          }
          return '';
        };
        var tooltipFooter = function (items) {
          if (!items.length) return '';
          var idx = items[0].dataIndex;
          var sit = series.situation[idx];
          if (!sit) return '';
          return sit.desc;
        };

        // Plugin: alternating round backgrounds
        var roundBandsPlugin = {
          id: 'roundBands',
          beforeDraw: function (chart) {
            var ctx = chart.ctx;
            var xScale = chart.scales.x;
            var yTop = chart.chartArea.top;
            var yBottom = chart.chartArea.bottom;
            var labels = chart.data.labels;
            if (!labels || labels.length === 0) return;

            // Group label indices by round number
            var rounds = [];
            var currentRound = null;
            var startIdx = 0;
            for (var ri = 0; ri < labels.length; ri++) {
              var m = labels[ri].match(/^R(\d+)/);
              var rn = m ? m[1] : currentRound;
              if (rn !== currentRound) {
                if (currentRound !== null) {
                  rounds.push({ round: parseInt(currentRound, 10), start: startIdx, end: ri - 1 });
                }
                currentRound = rn;
                startIdx = ri;
              }
            }
            if (currentRound !== null) {
              rounds.push({ round: parseInt(currentRound, 10), start: startIdx, end: labels.length - 1 });
            }

            // Draw bands for even rounds
            ctx.save();
            for (var bi = 0; bi < rounds.length; bi++) {
              if (rounds[bi].round % 2 === 0) {
                var x1 = xScale.getPixelForValue(rounds[bi].start) - (xScale.getPixelForValue(1) - xScale.getPixelForValue(0)) / 2;
                var x2 = xScale.getPixelForValue(rounds[bi].end) + (xScale.getPixelForValue(1) - xScale.getPixelForValue(0)) / 2;
                ctx.fillStyle = 'rgba(55, 65, 81, 0.08)';
                ctx.fillRect(x1, yTop, x2 - x1, yBottom - yTop);
              }
            }
            ctx.restore();
          }
        };

        // Plugin: semi-transparent state ribbon over the top of the chart
        var ribbonHeight = 26;
        var ribbonAlpha = 0.72;
        function hexToRgba(hex, a) {
          var m = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
          if (!m) return hex;
          return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')';
        }
        var ribbonPlugin = {
          id: 'stateRibbon',
          afterDraw: function (chart) {
            var sit = series.situation;
            var n = sit.length;
            if (n === 0) return;
            var ctx = chart.ctx;
            var xScale = chart.scales.x;
            var left = chart.chartArea.left;
            var right = chart.chartArea.right;
            var bottom = chart.chartArea.bottom;
            var ribbonBottom = bottom;
            var ribbonTop = Math.max(bottom - ribbonHeight, chart.chartArea.top + 4);

            ctx.save();
            for (var si = 0; si < n; si++) {
              var x0 = si === 0 ? left : xScale.getPixelForValue(si - 0.5);
              var x1 = si === n - 1 ? right : xScale.getPixelForValue(si + 0.5);
              var segW = x1 - x0;
              var color = series.stateColors[sit[si].key] || '#6b7280';
              ctx.fillStyle = hexToRgba(color, ribbonAlpha);
              ctx.fillRect(x0, ribbonTop, segW + 0.5, ribbonBottom - ribbonTop);
            }
            ctx.restore();

            ctx.save();
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
            var runs = [];
            var ri = 0;
            while (ri < n) {
              var runStart = ri;
              var runDesc = sit[ri].desc;
              ri++;
              while (ri < n && sit[ri].desc === runDesc) ri++;
              runs.push({ start: runStart, end: ri, desc: runDesc });
            }
            for (var r = 0; r < runs.length; r++) {
              var run = runs[r];
              var x0 = run.start === 0 ? left : xScale.getPixelForValue(run.start - 0.5);
              var x1 = run.end === n ? right : xScale.getPixelForValue(run.end - 0.5);
              var runW = x1 - x0;
              var displayLabel = run.desc;
              if (displayLabel.length > 2) {
                var short = displayLabel.indexOf(':') > -1 ? displayLabel.split(':')[0].trim() : displayLabel;
                if (ctx.measureText(displayLabel).width > runW - 6) displayLabel = short;
                if (ctx.measureText(displayLabel).width > runW - 6) displayLabel = short.substring(0, 12);
              }
              if (ctx.measureText(displayLabel).width <= runW - 4) {
                ctx.fillText(displayLabel, x0 + (runW - ctx.measureText(displayLabel).width) / 2, (ribbonTop + ribbonBottom) / 2);
              }
            }
            ctx.restore();
          }
        };

        // Build custom HTML legend
        var legendBox = document.getElementById('chartLegend');
        var legendHtml = '';
        function swatch(color, type) {
          if (type === 'line') return '<span class="swatch swatch-line" style="background:' + color + '"></span>';
          if (type === 'dashed') return '<span class="swatch swatch-line-dashed" style="border-color:' + color + '"></span>';
          return '<span class="swatch" style="background:' + color + '"></span>';
        }
        if (showHealth) {
          legendHtml += '<span class="legend-item">' + swatch(CHART_P1, 'line') + pb1 + ' health</span>';
          legendHtml += '<span class="legend-item">' + swatch(CHART_P2, 'line') + pb2 + ' health</span>';
        }
        if (showTotalAdv) {
          legendHtml += '<span class="legend-item">' + swatch(CHART_P1) + pb1 + ' total resource adv</span>';
          legendHtml += '<span class="legend-item">' + swatch(CHART_P2) + pb2 + ' total resource adv</span>';
        }
        if (showBf) {
          legendHtml += '<span class="legend-item">' + swatch(CHART_P1, 'dashed') + pb1 + ' battlefield</span>';
          legendHtml += '<span class="legend-item">' + swatch(CHART_P2, 'dashed') + pb2 + ' battlefield</span>';
          legendHtml += '<span class="legend-item">' + swatch('rgba(13, 148, 136, 0.6)') + pb1 + ' BF advantage</span>';
          legendHtml += '<span class="legend-item">' + swatch('rgba(180, 83, 9, 0.6)') + pb2 + ' BF advantage</span>';
        }
        if (showDice) {
          legendHtml += '<span class="legend-item">' + swatch('rgba(13, 148, 136, 0.7)') + pb1 + ' dice advantage</span>';
          legendHtml += '<span class="legend-item">' + swatch('rgba(180, 83, 9, 0.7)') + pb2 + ' dice advantage</span>';
        }
        if (showAttacks) {
          legendHtml += '<span class="legend-item">' + swatch(CHART_P1) + pb1 + ' attacks</span>';
          legendHtml += '<span class="legend-item">' + swatch(CHART_P2) + pb2 + ' attacks</span>';
        }
        // Strategy strip legend
        legendHtml += '<span class="legend-sep"></span>';
        var stKeys = Object.keys(series.stateLabels);
        for (var sk = 0; sk < stKeys.length; sk++) {
          legendHtml += '<span class="legend-item">' + swatch(series.stateColors[stKeys[sk]]) + series.stateLabels[stKeys[sk]] + '</span>';
        }
        legendBox.innerHTML = legendHtml;

        chart = new Chart(canvas, {
          type: 'bar',
          data: { labels: series.labels, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  afterLabel: tooltipAfterLabel,
                  footer: tooltipFooter
                }
              }
            },
            scales: scales
          },
          plugins: [roundBandsPlugin, ribbonPlugin]
        });
      }

      function renderStats() {
        var section = document.getElementById('statsSection');
        var content = document.getElementById('statsContent');
        if (!replayData || !replayData.stats) { section.classList.add('hidden'); return; }

        var series = buildSeries();
        if (!series) { section.classList.add('hidden'); return; }

        var p1 = replayData.playerNames[0];
        var p2 = replayData.playerNames[1];
        var pb1 = replayData.phoenixborn[p1];
        var pb2 = replayData.phoenixborn[p2];
        var s1 = replayData.stats[p1];
        var s2 = replayData.stats[p2];

        // Compute turns in control from situation data
        var turnsInControl1 = 0, turnsInControl2 = 0, turnsParity = 0;
        for (var i = 0; i < series.situation.length; i++) {
          var sit = series.situation[i];
          if (sit.player === pb1) turnsInControl1++;
          else if (sit.player === pb2) turnsInControl2++;
          else turnsParity++;
        }

        // Compute total rounds
        var totalRounds = replayData.gameResult ? replayData.gameResult.round : 0;

        // Starting and final health
        var startH1 = series.health1[0] || 0;
        var startH2 = series.health2[0] || 0;
        var finalH1 = series.health1[series.health1.length - 1] || 0;
        var finalH2 = series.health2[series.health2.length - 1] || 0;

        function row(label, v1, v2) {
          return '<tr><td class="stat-label">' + escapeHtml(label) + '</td><td class="num p1-col">' + v1 + '</td><td class="num p2-col">' + v2 + '</td></tr>';
        }

        var html = '<table class="stats-table">';
        html += '<thead><tr><th></th><th class="p1-col">' + escapeHtml(pb1) + '</th><th class="p2-col">' + escapeHtml(pb2) + '</th></tr></thead>';
        html += '<tbody>';
        html += row('Starting health', startH1, startH2);
        html += row('Final health', finalH1, finalH2);
        html += row('Damage dealt to PB', s1.totalDamageDealt, s2.totalDamageDealt);
        html += row('Total attacks', s1.totalAttacks, s2.totalAttacks);
        html += row('Total units attacking', s1.totalUnitsAttacking, s2.totalUnitsAttacking);
        html += row('Cards played', s1.cardsPlayed, s2.cardsPlayed);
        html += row('Cards meditated', s1.meditated, s2.meditated);
        html += row('Dice spent', s1.totalDiceSpent, s2.totalDiceSpent);
        html += row('Dice available (' + totalRounds + ' rounds)', totalRounds * 10, totalRounds * 10);
        html += row('Turns in control', turnsInControl1, turnsInControl2);
        if (turnsParity > 0) {
          html += '<tr><td class="stat-label">Turns at parity / contested</td><td class="num" colspan="2" style="text-align:center;color:var(--muted)">' + turnsParity + '</td></tr>';
        }
        html += '</tbody></table>';

        content.innerHTML = html;
        section.classList.remove('hidden');
      }

      function renderNarrative() {
        var section = document.getElementById('narrativeSection');
        var content = document.getElementById('narrativeContent');
        if (!replayData) { section.classList.add('hidden'); return; }

        var series = buildSeries();
        if (!series) { section.classList.add('hidden'); return; }

        var p1 = replayData.playerNames[0];
        var p2 = replayData.playerNames[1];
        var pb1 = replayData.phoenixborn[p1];
        var pb2 = replayData.phoenixborn[p2];
        var html = '';
        var currentRound = null;

        for (var i = 0; i < series.labels.length; i++) {
          var label = series.labels[i];

          // Round start snapshots
          if (label.indexOf('start') !== -1) {
            if (currentRound !== null) html += '</div>'; // close previous round
            var rNum = label.match(/R(\d+)/);
            currentRound = rNum ? rNum[1] : '?';
            html += '<div class="narr-round" role="group" aria-label="Round ' + currentRound + '">';
            html += '<div class="narr-round-header">Round ' + currentRound + '</div>';
            continue;
          }

          // End snapshot
          if (label === 'End') continue;

          // Turn pair snapshot
          var h1 = series.health1[i];
          var h2 = series.health2[i];
          var prevH1 = i > 0 ? series.health1[i - 1] : h1;
          var prevH2 = i > 0 ? series.health2[i - 1] : h2;
          var dmg1 = prevH1 - h1; // damage taken by p1
          var dmg2 = prevH2 - h2; // damage taken by p2

          var parts = [];

          // Health changes
          if (dmg2 > 0) parts.push(pb1 + ' deals ' + dmg2 + ' damage to ' + pb2 + ' (' + h2 + ' HP remaining)');
          if (dmg1 > 0) parts.push(pb2 + ' deals ' + dmg1 + ' damage to ' + pb1 + ' (' + h1 + ' HP remaining)');
          if (dmg1 === 0 && dmg2 === 0) parts.push('No Phoenixborn damage this turn');

          // Attacks
          if (series.attackCount[i] > 0) {
            var units = series.attackUnits[i];
            parts.push(series.attackCount[i] + ' unit(s) attacked' + (units ? ': ' + units : ''));
          }

          // Dice
          var da = series.diceAdvantage[i];
          if (da > 0) parts.push(pb1 + ' leads by ' + da + ' unspent dice');
          else if (da < 0) parts.push(pb2 + ' leads by ' + (-da) + ' unspent dice');
          else parts.push('Dice tied');

          // Battlefield
          var ba = series.bfValueAdv[i];
          if (ba > 0) parts.push(pb1 + ' leads battlefield value by ' + ba);
          else if (ba < 0) parts.push(pb2 + ' leads battlefield value by ' + (-ba));
          else parts.push('Battlefield value tied');

          // Situation (highlight with state color like the strip)
          var sit = series.situation[i];
          var sitText = sit.desc;
          var stateColor = series.stateColors[sit.key] || '#6b7280';

          var prevAdv = i > 0 ? (series.totalAdvantage[i - 1] || 0) : (series.totalAdvantage[i] || 0);
          var currAdv = series.totalAdvantage[i] || 0;
          var swing = Math.abs(currAdv - prevAdv);
          var isPivot = swing >= 2;

          var labelHtml = escapeHtml(label);
          if (isPivot) labelHtml = '<span class="narr-pivot-label">' + labelHtml + '</span>';

          html += '<div class="narr-turn' + (isPivot ? ' narr-pivot' : '') + '" role="listitem">';
          html += '<strong>' + labelHtml + ':</strong> ';
          html += escapeHtml(parts.join('. ')) + '. ';
          html += '<span class="narr-state" style="background:' + stateColor + ';color:rgba(255,255,255,0.95)">' + escapeHtml(sitText) + '</span>';
          if (isPivot) {
            var swingDir = currAdv > prevAdv ? ' toward ' + pb1 : ' toward ' + pb2;
            var swingAmt = currAdv - prevAdv;
            html += '<div class="narr-swing-note">Resource advantage swung by ' + (swingAmt > 0 ? '+' : '') + swingAmt + swingDir + '</div>';
          }
          if (isPivot && series.chatLines && series.chatLines[i] && series.chatLines[i].length > 0) {
            html += '<div class="narr-chat-swing">Chat: ' + series.chatLines[i].map(function (l) { return escapeHtml(l); }).join('; ') + '</div>';
          }
          html += '</div>';
        }

        if (currentRound !== null) html += '</div>'; // close last round

        // Game result
        if (replayData.gameResult) {
          var r = replayData.gameResult;
          var winner = r.winnerPb || r.winner;
          html += '<div class="narr-result">' + escapeHtml(winner) + ' wins in Round ' + r.round + ', Turn ' + r.turn;
          if (r.method === 'concession') html += ' by concession';
          html += '.</div>';
        }

        content.innerHTML = html;
        section.classList.remove('hidden');
      }

      function copyForDiscord() {
        var series = buildSeries();
        if (!series || !replayData) return;

        var p1 = replayData.playerNames[0];
        var p2 = replayData.playerNames[1];
        var pb1 = replayData.phoenixborn[p1];
        var pb2 = replayData.phoenixborn[p2];
        var s1 = replayData.stats[p1] || {};
        var s2 = replayData.stats[p2] || {};

        var finalH1 = series.health1[series.health1.length - 1] || 0;
        var finalH2 = series.health2[series.health2.length - 1] || 0;

        var turnsInControl1 = 0, turnsInControl2 = 0;
        for (var t = 0; t < series.situation.length; t++) {
          var sit = series.situation[t];
          if (sit.player === pb1) turnsInControl1++;
          else if (sit.player === pb2) turnsInControl2++;
        }

        // Find hypest turn: biggest |totalAdvantage swing|
        var hypestIdx = -1;
        var hypestSwing = 0;
        for (var i = 1; i < series.labels.length; i++) {
          var lbl = series.labels[i];
          if (lbl.indexOf('start') !== -1 || lbl === 'End') continue;
          var prevAdv = series.totalAdvantage[i - 1] || 0;
          var currAdv = series.totalAdvantage[i] || 0;
          var swing = Math.abs(currAdv - prevAdv);
          if (swing > hypestSwing) {
            hypestSwing = swing;
            hypestIdx = i;
          }
        }

        // Build Discord block
        var out = '';

        if (replayData.gameResult) {
          var r = replayData.gameResult;
          var winner = r.winnerPb || r.winner;
          out += '**' + winner + '** wins Round ' + r.round + ', Turn ' + r.turn;
          if (r.method === 'concession') out += ' by concession';
          out += '.\n\n';
        }

        function pad(s, w) {
          var str = String(s);
          while (str.length < w) str += ' ';
          return str;
        }
        var colL = 20;
        var colN = 6;
        out += '```\n';
        out += pad('', colL) + pad(pb1, colN) + pad(pb2, colN) + '\n';
        out += pad('Final health', colL) + pad(finalH1, colN) + pad(finalH2, colN) + '\n';
        out += pad('Damage dealt', colL) + pad(s1.totalDamageDealt || 0, colN) + pad(s2.totalDamageDealt || 0, colN) + '\n';
        out += pad('Attacks', colL) + pad(s1.totalAttacks || 0, colN) + pad(s2.totalAttacks || 0, colN) + '\n';
        out += pad('Dice spent', colL) + pad(s1.totalDiceSpent || 0, colN) + pad(s2.totalDiceSpent || 0, colN) + '\n';
        out += pad('Cards played', colL) + pad(s1.cardsPlayed || 0, colN) + pad(s2.cardsPlayed || 0, colN) + '\n';
        out += pad('Turns in control', colL) + pad(turnsInControl1, colN) + pad(turnsInControl2, colN) + '\n';
        out += '```\n\n';

        if (hypestIdx >= 0 && hypestSwing > 0) {
          var hypLabel = series.labels[hypestIdx];
          var rMatch = hypLabel.match(/R(\d+)\.(\d+)/);
          var hypRound = rMatch ? rMatch[1] : '?';
          var hypTurn = rMatch ? rMatch[2] : '?';
          var prevAdv = series.totalAdvantage[hypestIdx - 1] || 0;
          var currAdv = series.totalAdvantage[hypestIdx] || 0;
          var swingAmt = currAdv - prevAdv;
          var toward = swingAmt > 0 ? pb1 : pb2;
          var sit = series.situation[hypestIdx];
          var sitText = sit ? sit.desc : '';

          out += '> **HYPEST TURN — Round ' + hypRound + ', Turn ' + hypTurn + ':** Resource advantage swung by ';
          out += (swingAmt > 0 ? '+' : '') + swingAmt + ' toward ' + toward + '. ' + sitText;

          var chat = series.chatLines && series.chatLines[hypestIdx];
          if (chat && chat.length > 0) {
            var chatStr = chat.join('; ');
            if (chatStr.length > 180) chatStr = chatStr.substring(0, 177) + '...';
            out += '\n> Chat: ' + chatStr;
          }
          out += '\n';
        }

        navigator.clipboard.writeText(out).then(function () {
          var btn = document.getElementById('copyDiscordBtn');
          var orig = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = orig; }, 1500);
        }).catch(function () {
          showError('Could not copy to clipboard.');
        });
      }

      function onReplayLoaded(data) {
        clearError();
        replayData = data;
        renderPhoenixborn();
        renderGameResult();
        chartSection.classList.remove('hidden');
        document.getElementById('exportRow').classList.remove('hidden');

        renderNarrative();

        var text = document.getElementById('chatInput').value.trim();
        if (!text) {
          showError('Paste a game chat log first.');
          return;
        }
        var normalized = parseChatLog(text);
        if (!normalized) {
          showError('Could not parse game chat. Ensure it includes "X brings Y to battle" and "Turn N - Player" lines.');
          return;
        }
        if (!normalized.snapshots.length) {
          showError('No turns found in the chat log.');
          return;
        }
        onReplayLoaded(normalized);
      });

      if (window.location.search.indexOf('demo=1') !== -1) {
        fetch('demo-chat.txt')
          .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('Could not load demo-chat.txt')); })
